<?xml version="1.0" encoding="UTF-8"?>
<svg width="108" height="108" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
  <!--
    Password Manager app icon (shared source of truth).
    Padlock on a rounded dark tile. Geometry matches the Android adaptive-icon
    foreground so desktop (.ico) and mobile look identical.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252540"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="108" height="108" rx="24" ry="24" fill="url(#bg)"/>

  <!-- Lock body -->
  <path fill="#89B4FA"
        d="M38,52 L70,52 C72.2,52 74,53.8 74,56 L74,76 C74,78.2 72.2,80 70,80 L38,80 C35.8,80 34,78.2 34,76 L34,56 C34,53.8 35.8,52 38,52 Z"/>
  <!-- Shackle -->
  <path fill="#89B4FA"
        d="M42,52 L42,42 C42,35.4 47.4,30 54,30 C60.6,30 66,35.4 66,42 L66,52 L62,52 L62,42 C62,37.6 58.4,34 54,34 C49.6,34 46,37.6 46,42 L46,52 Z"/>
  <!-- Keyhole -->
  <path fill="#1E1E2E"
        d="M54,60 C56.2,60 58,61.8 58,64 C58,65.4 57.2,66.6 56,67.4 L56,72 C56,73.1 55.1,74 54,74 C52.9,74 52,73.1 52,72 L52,67.4 C50.8,66.6 50,65.4 50,64 C50,61.8 51.8,60 54,60 Z"/>
</svg>
