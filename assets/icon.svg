<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    Password Manager app icon.
    A padlock with a keyhole, on a rounded dark tile with a blue accent.
    Shared source of truth for the Windows .ico and Android launcher icons.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252540"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9CC1FF"/>
      <stop offset="1" stop-color="#6E9BF0"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Shackle -->
  <path d="M176 232 V180 a80 80 0 0 1 160 0 V232"
        fill="none" stroke="#89B4FA" stroke-width="34" stroke-linecap="round"/>

  <!-- Lock body -->
  <rect x="140" y="228" width="232" height="188" rx="34" ry="34" fill="url(#lock)"/>

  <!-- Keyhole -->
  <circle cx="256" cy="304" r="30" fill="#1E1E2E"/>
  <rect x="244" y="318" width="24" height="58" rx="12" ry="12" fill="#1E1E2E"/>
</svg>
