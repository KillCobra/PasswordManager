apply plugin: 'com.android.application'

android {
    namespace 'com.passwordmanager'
    compileSdk 33

    defaultConfig {
        applicationId "com.passwordmanager"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    // A fixed, committed debug keystore so every build (local machine and CI)
    // signs with the SAME key. Without this, each environment uses its own
    // generated debug key and Android rejects in-place updates with
    // "package conflicts with an existing package", forcing an uninstall that
    // would delete the vault. Sharing one debug key lets app-debug.apk update
    // in place and keep the existing vault data.
    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            // Debug-signed for now so unsigned release builds still install.
            // Replace with a real release keystore before publishing.
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
        }
    }

    ndkVersion "25.2.9519653"
}

dependencies {
    implementation 'com.google.android.material:material:1.9.0'
}