name: Release

# Build the Windows desktop exe AND the Android APK, then publish BOTH to a
# single GitHub Release on a version tag.
#
# How to cut a release:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The release notes include an auto-generated changelog of the commits between
# the previous tag and this one.
#
# Manual runs (workflow_dispatch) build both binaries and upload them as run
# artifacts for inspection, but do not create a Release (there is no tag).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # create the Release and upload assets
  actions: write    # delete old run artifacts

env:
  NDK_VERSION: "25.2.9519653"

jobs:
  # ── Windows desktop executable ──────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build password_manager.exe (MSVC / release)
        shell: cmd
        run: build.bat msvc release

      - name: Verify the executable was produced
        shell: pwsh
        run: |
          if (-not (Test-Path password_manager.exe)) {
            Write-Error "password_manager.exe was not produced by the build."
            exit 1
          }
          Get-Item password_manager.exe | Format-List Name, Length

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: password_manager-exe
          path: password_manager.exe
          if-no-files-found: error
          retention-days: 1

  # ── Android release APK ─────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform, build-tools, and NDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and rename APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then echo "No release APK produced" >&2; exit 1; fi
          cp "$APK" password_manager.apk
          ls -l password_manager.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: password_manager-apk
          path: password_manager.apk
          if-no-files-found: error
          retention-days: 1

  # ── Publish a single Release with both binaries + changelog ─────────────
  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out source (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: password_manager-exe
          path: dist

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: password_manager-apk
          path: dist

      - name: Generate changelog since previous tag
        id: changelog
        run: |
          set -euo pipefail
          CURRENT="${GITHUB_REF_NAME}"
          # Previous tag before the current one (by tag creation order).
          PREV="$(git describe --tags --abbrev=0 "${CURRENT}^" 2>/dev/null || true)"
          {
            echo "## Password Manager ${CURRENT}"
            echo ""
            echo "Desktop: \`password_manager.exe\`  •  Android: \`password_manager.apk\`"
            echo ""
            echo "### Changes"
            if [ -n "$PREV" ]; then
              echo "_Commits since ${PREV}:_"
              echo ""
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV}..${CURRENT}"
            else
              echo "_All commits up to ${CURRENT}:_"
              echo ""
              git log --no-merges --pretty=format:'- %s (%h)' "${CURRENT}"
            fi
          } > CHANGELOG_RELEASE.md
          echo "Generated changelog:"
          cat CHANGELOG_RELEASE.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG_RELEASE.md
          files: |
            dist/password_manager.exe
            dist/password_manager.apk

      - name: Delete older run artifacts (keep only the latest per name)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const arts = await github.paginate(
              github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const newestByName = new Map();
            for (const a of arts) {
              const cur = newestByName.get(a.name);
              if (!cur || new Date(a.created_at) > new Date(cur.created_at)) {
                newestByName.set(a.name, a);
              }
            }
            const keep = new Set([...newestByName.values()].map(a => a.id));
            for (const a of arts) {
              if (!keep.has(a.id)) {
                core.info(`Deleting old artifact ${a.name} #${a.id}`);
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
              }
            }
