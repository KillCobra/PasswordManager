name: Android Build Check

# Verifies the Android app (Java + native via NDK + resources) still builds.
#
# Triggers:
#   - push to main touching the app/native core: build check only (no artifact)
#   - pull_request: build check only
#   - workflow_dispatch (manual): build AND upload a debug APK for testing
#
# Rationale: we no longer publish a debug APK on every push (that produced a new
# artifact each time). Pushes just get a fast "does it still build" gate; grab a
# testable APK on demand via "Run workflow", and get the real signed APK from a
# release tag (see release.yml).

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - "src/**"
      - "include/**"
      - "platform/**"
      - "vendor/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "include/**"
      - "platform/**"
      - "vendor/**"
      - "CMakeLists.txt"

permissions:
  contents: read
  actions: write   # to prune old artifacts when we do upload one

jobs:
  build-check:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "25.2.9519653"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform, build-tools, and NDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"

      - name: Build debug APK (compile/build gate)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Only publish a downloadable APK on manual runs.
      - name: Upload debug APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Delete older artifacts (keep only the latest)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const arts = await github.paginate(
              github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const newestByName = new Map();
            for (const a of arts) {
              const cur = newestByName.get(a.name);
              if (!cur || new Date(a.created_at) > new Date(cur.created_at)) {
                newestByName.set(a.name, a);
              }
            }
            const keep = new Set([...newestByName.values()].map(a => a.id));
            for (const a of arts) {
              if (!keep.has(a.id)) {
                core.info(`Deleting old artifact ${a.name} #${a.id}`);
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
              }
            }
