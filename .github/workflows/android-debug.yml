name: Android Debug APK

# Builds a debug APK of the Android app and uploads it as a downloadable
# CI artifact for testing (sideload via `adb install app-debug.apk`).
#
# Triggers:
#   - Manually from the Actions tab (workflow_dispatch)
#   - On pushes / PRs that touch the app or the native core it links against
#
# This is a debug build: it is signed with the standard Android debug key,
# so it installs on devices/emulators without extra signing setup. It is
# not suitable for Play Store upload.
#
# Note: ubuntu-latest ships with the Android SDK preinstalled (ANDROID_HOME /
# ANDROID_SDK_ROOT are set), so we install the required NDK with the
# preinstalled sdkmanager rather than relying on a third-party setup action.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - "src/**"
      - "include/**"
      - "platform/**"
      - "vendor/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-debug.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "include/**"
      - "platform/**"
      - "vendor/**"
      - "CMakeLists.txt"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "25.2.9519653"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and accept licenses
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using Android SDK at: $SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
